$kind: http-request
url: "{{baseUrl}}/accountants/{{accountantId}}/efactura/archive/{{archiveId}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.collectionVariables.get('archiveId')) {
        console.log('Nothing imported yet: the import needs a company with a certificate and invoices in SPV.');
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Detail with lines', () => {
        pm.expect(pm.response.json().lines).to.be.an('array');
      });
    language: text/javascript
order: 10000
