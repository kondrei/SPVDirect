$kind: http-request
description: 'Public. Returns `{ "status": "ok" }`.'
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Body is { status: ok }', () => {
        pm.expect(pm.response.json()).to.eql({ status: 'ok' });
      });
    language: text/javascript
order: 1000
