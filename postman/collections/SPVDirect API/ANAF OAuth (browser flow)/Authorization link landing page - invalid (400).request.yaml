$kind: http-request
url: "{{baseUrl}}/anaf/authorize/invalid-token"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Explains the link is invalid', () => pm.expect(pm.response.text()).to.include('Linkul de autorizare nu este valid.'));
    language: text/javascript
order: 4000
