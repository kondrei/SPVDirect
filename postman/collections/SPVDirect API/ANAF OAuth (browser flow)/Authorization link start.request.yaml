$kind: http-request
description: Public. 302 to ANAF authorize for the link flow; sets the `spv_anaf_oauth` state cookie.
url: "{{baseUrl}}/anaf/authorize/{{linkToken}}/start"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 302', () => pm.response.to.have.status(302));
      const location = pm.response.headers.get('Location') || '';
      const [locationPath, locationQuery = ''] = location.split('?');
      const q = {};
      locationQuery.split('&').filter(Boolean).forEach((p) => { const [k, v = ''] = p.split('='); q[decodeURIComponent(k)] = decodeURIComponent(v.split('+').join(' ')); });
      pm.test('Redirects to ANAF authorize', () => pm.expect(locationPath).to.include('/anaf-oauth2/v1/authorize'));
      pm.test('ANAF authorize parameters', () => {
        pm.expect(q.response_type).to.eql('code');
        pm.expect(q.token_content_type).to.eql('jwt');
        pm.expect(q.client_id).to.not.be.empty;
        pm.expect(q.redirect_uri).to.match(/\/anaf\/callback$/);
        pm.expect(q.state).to.not.be.empty;
        pm.expect('scope' in q).to.be.false;
      });
      pm.test('Sets the spv_anaf_oauth cookie', () => pm.expect(pm.cookies.has('spv_anaf_oauth')).to.be.true);
    language: text/javascript
settings:
  followRedirects: false
order: 5000
