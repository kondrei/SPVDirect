$kind: http-request
description: Public HTML page for the certificate holder. 400 if the link is invalid, used or expired.
url: "{{baseUrl}}/anaf/authorize/{{linkToken}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('HTML page with the start button', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html');
        pm.expect(pm.response.text()).to.include('/anaf/authorize/' + pm.collectionVariables.get('linkToken') + '/start');
      });
    language: text/javascript
order: 3000
