$kind: http-request
url: "{{baseUrl}}/accountants/{{accountantId}}/companies"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Returns an array of own companies', () => {
        const list = pm.response.json();
        pm.expect(list).to.be.an('array');
        list.forEach((c) => pm.expect(c.accountantId).to.eql(Number(pm.collectionVariables.get('accountantId'))));
      });
    language: text/javascript
order: 1000
