$kind: http-request
description: "Streams a ZIP with everything SPVDirect holds for the company: `firma.json`, the logo, `facturi.csv`/`facturi.json` with each invoice's PDF and UBL XML, `efactura.csv`, `spv.csv` with the stored SPV PDFs, and `erori.txt` for files that could not be read. 5 requests/min."
url: "{{baseUrl}}/accountants/{{accountantId}}/companies/{{companyId}}/export"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Is a ZIP attachment', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/zip');
        pm.expect(pm.response.headers.get('Content-Disposition')).to.match(/^attachment; filename="firma-\d+-export-\d{4}-\d{2}-\d{2}\.zip"$/);
      });
    language: text/javascript
order: 9000
