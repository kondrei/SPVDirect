$kind: http-request
url: "{{baseUrl}}/accountants/{{accountantId}}/companies/{{companyId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "anafConnectionId": 2147483647
    }
scripts:
  - type: afterResponse
    code: |-
      const errorMessage = () => {
        const m = pm.response.json().message;
        return Array.isArray(m) ? m.join(' | ') : m;
      };
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Message is "Certificat ANAF necunoscut"', () => pm.expect(errorMessage()).to.eql('Certificat ANAF necunoscut'));
    language: text/javascript
order: 16000
