$kind: http-request
description: "Both fields optional: `name` (1-255 chars) and `anafConnectionId` (integer id of an own connection, or `null` to detach). Linking a different certificate first asks ANAF (`listaMesajeFactura?zile=1&cif=<CUI>`) whether it has SPV rights for the company's CUI; without them the answer is 400 \"Certificatul nu are drept în SPV pentru CUI ...\" and nothing is saved. Rate limited to 20/min. The pre-request script adds `anafConnectionId` when `connectionId` is set; the test accepts that 400 when the certificate is not authorized for the test CUI."
url: "{{baseUrl}}/accountants/{{accountantId}}/companies/{{companyId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Firma Test SRL (redenumit)"
    }
scripts:
  - type: beforeRequest
    code: |-
      const body = { name: 'Firma Test SRL (redenumit)' };
      const connectionId = pm.collectionVariables.get('connectionId');
      if (connectionId) body.anafConnectionId = Number(connectionId);
      pm.request.body.update(JSON.stringify(body, null, 2));
    language: text/javascript
  - type: afterResponse
    code: |-
      const connectionId = pm.collectionVariables.get('connectionId');
      if (connectionId && pm.response.code === 400) {
        pm.test('ANAF refused the certificate for this CUI', () => pm.expect(pm.response.json().message).to.include('nu are drept în SPV'));
        return;
      }
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Name updated', () => pm.expect(pm.response.json().name).to.eql('Firma Test SRL (redenumit)'));
      if (connectionId) {
        pm.test('Certificate attached', () => pm.expect(pm.response.json().anafConnectionId).to.eql(Number(connectionId)));
      }

      pm.test('Company has the expected shape', () => {
        const c = pm.response.json();
        pm.expect(c.id).to.be.a('number').and.to.be.above(0);
        pm.expect(c.accountantId).to.eql(Number(pm.collectionVariables.get('accountantId')));
        pm.expect(c.cui).to.match(/^\d{2,10}$/);
        pm.expect(c.name).to.be.a('string').and.not.empty;
        pm.expect(c).to.have.property('anafConnectionId');
        pm.expect(c).to.include.keys('regCom', 'address', 'caenCode', 'registrationStatus', 'vatPayer', 'vatOnCollection', 'splitVat', 'eFactura', 'inactive', 'anafSyncedAt', 'createdAt', 'updatedAt');
      });
    language: text/javascript
order: 15000
