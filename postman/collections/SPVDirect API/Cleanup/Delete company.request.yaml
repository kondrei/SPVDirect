$kind: http-request
description: "Soft delete: marks the company, its invoices, e-Factura uploads and SPV messages as deleted (they disappear from every list) and drops unused authorization links. Returns 204, or 409 while an invoice is being sent to ANAF. A monthly job erases the rows and their Storage files 30 days later. Skipped unless this run created the company, so existing data is kept."
url: "{{baseUrl}}/accountants/{{accountantId}}/companies/{{companyId}}"
method: DELETE
scripts:
  - type: beforeRequest
    code: |-
      if (pm.collectionVariables.get('companyCreatedByRun') !== 'true') {
        console.log('Company existed before this run: not deleting it.');
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 204', () => pm.response.to.have.status(204));
      pm.collectionVariables.set('companyCreatedByRun', '');
      pm.sendRequest({ url: pm.variables.replaceIn('{{baseUrl}}/accountants/{{accountantId}}/companies/{{companyId}}'), method: 'GET' }, (err, res) => {
        pm.test('Company is gone (404)', () => pm.expect(res.code).to.eql(404));
      });
    language: text/javascript
order: 1000
