$kind: http-request
description: The account is kept and the session stays valid.
url: "{{baseUrl}}/accountants/{{accountantId}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "password": "not-the-password" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Message is "Parola este incorectă"', () => pm.expect(pm.response.json().message).to.eql('Parola este incorectă'));
