$kind: http-request
description: "Streams a ZIP of the whole account: `cont.json` (profile), `certificate.csv` (no tokens), `firme.csv`, a `firme/<cui>/` folder per company with the same content as the company export, and `spv-fara-firma.csv` for SPV messages that match no company. 5 requests/min."
url: "{{baseUrl}}/accountants/{{accountantId}}/export"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Is a ZIP attachment', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/zip');
        pm.expect(pm.response.headers.get('Content-Disposition')).to.match(/^attachment; filename="cont-spvdirect-export-\d{4}-\d{2}-\d{2}\.zip"$/);
      });
    language: text/javascript
order: 3000
