$kind: http-request
description: "Turns every method off (204), removes the secret, the email code and the recovery code, re-issues the session cookie and ends other sessions."
url: "{{baseUrl}}/accountants/{{accountantId}}/mfa"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const errorMessage = () => {
        const m = pm.response.json().message;
        return Array.isArray(m) ? m.join(' | ') : m;
      };
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('MFA is off', () => pm.expect(errorMessage()).to.eql('Autentificarea în doi pași nu este activă.'));
    language: text/javascript
order: 12000
