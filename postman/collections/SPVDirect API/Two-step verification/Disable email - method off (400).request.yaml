$kind: http-request
url: "{{baseUrl}}/accountants/{{accountantId}}/mfa/email"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const errorMessage = () => {
        const m = pm.response.json().message;
        return Array.isArray(m) ? m.join(' | ') : m;
      };
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Method is off', () => pm.expect(errorMessage()).to.eql('Metoda aleasă nu este activă pentru acest cont.'));
    language: text/javascript
order: 10000
