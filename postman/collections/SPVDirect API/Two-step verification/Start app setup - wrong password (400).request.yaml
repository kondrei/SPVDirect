$kind: http-request
description: "With the right password it answers 200 with `{ secret, otpauthUri }` for the authenticator app; MFA stays off until `setup/confirm`. Throttled (10/min)."
url: "{{baseUrl}}/accountants/{{accountantId}}/mfa/app/setup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "parola-gresita-000"
    }
scripts:
  - type: afterResponse
    code: |-
      const errorMessage = () => {
        const m = pm.response.json().message;
        return Array.isArray(m) ? m.join(' | ') : m;
      };
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Romanian message', () => pm.expect(errorMessage()).to.eql('Parola este incorectă'));
    language: text/javascript
order: 4000
