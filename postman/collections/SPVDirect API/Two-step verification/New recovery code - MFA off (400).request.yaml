$kind: http-request
description: "With MFA on it answers 200 with a new `{ recoveryCode }`; the old one stops working."
url: "{{baseUrl}}/accountants/{{accountantId}}/mfa/recovery-code"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const errorMessage = () => {
        const m = pm.response.json().message;
        return Array.isArray(m) ? m.join(' | ') : m;
      };
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('MFA is off', () => pm.expect(errorMessage()).to.eql('Autentificarea în doi pași nu este activă.'));
    language: text/javascript
order: 11000
