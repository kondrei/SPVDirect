$kind: http-request
description: "With the 6-digit code from the app it turns the app method on and answers 200 with `{ recoveryCode }`: 5 digits, shown once, when it is the first method, otherwise null. The session cookie is re-issued and other sessions end."
url: "{{baseUrl}}/accountants/{{accountantId}}/mfa/app/setup/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "12"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
