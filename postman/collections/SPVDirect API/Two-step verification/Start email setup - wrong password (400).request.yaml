$kind: http-request
description: "With the right password it emails a 6-digit code to the account address and answers `{ sentTo }` (masked). 429 within a minute of the last code, 503 when the email fails."
url: "{{baseUrl}}/accountants/{{accountantId}}/mfa/email/setup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "parola-gresita-000"
    }
scripts:
  - type: afterResponse
    code: |-
      const errorMessage = () => {
        const m = pm.response.json().message;
        return Array.isArray(m) ? m.join(' | ') : m;
      };
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Romanian message', () => pm.expect(errorMessage()).to.eql('Parola este incorectă'));
    language: text/javascript
order: 7000
