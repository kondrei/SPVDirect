$kind: http-request
description: Public, throttled (10/min). Password 10-200 chars, name optional. Sets the `spv_session` cookie.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "name": "Contabil Test"
    }
order: 1000
