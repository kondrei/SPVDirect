$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "testtesttest"
    }
scripts:
  - type: afterResponse
    code: |-
      const errorMessage = () => {
        const m = pm.response.json().message;
        return Array.isArray(m) ? m.join(' | ') : m;
      };
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Generic Romanian message', () => pm.expect(errorMessage()).to.eql('Email sau parolă incorectă'));
    language: text/javascript
order: 3000
